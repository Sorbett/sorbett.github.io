{% include base_path %}

<!-- start custom head snippets -->

<!-- Browser and saved-site icons use the author's GitHub avatar. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.favicon_avatar_url | escape }}?s=180&amp;v=4"/>
<link rel="icon" sizes="16x16" href="{{ site.favicon_avatar_url | escape }}?s=16&amp;v=4"/>
<link rel="icon" sizes="32x32" href="{{ site.favicon_avatar_url | escape }}?s=32&amp;v=4"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
