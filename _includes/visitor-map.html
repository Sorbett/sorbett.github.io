{% if site.mapmyvisitors.widget_id and site.mapmyvisitors.widget_id != "" %}
  {% if include.interactive %}
  <section class="personal-visitors" aria-label="All-time visitor map">
    <h3>Visitors</h3>
    <div class="personal-visitors-map">
      <script id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?cl=20262c&amp;w=a&amp;t=tt&amp;d={{ site.mapmyvisitors.widget_id | uri_escape | escape }}&amp;co=f3f5f7&amp;ct=5c6670&amp;cmo=697078&amp;cmn=20262c" defer></script>
    </div>
    <a class="personal-visitors-details" href="{{ site.mapmyvisitors.stats_url | escape }}">View visitor locations ↗</a>
  </section>
  {% else %}
  <section class="author__visitors" aria-label="All-time visitor map">
    <h3>Visitors · All time</h3>
    <div class="author__visitors-map">
      <a href="{{ site.mapmyvisitors.stats_url | escape }}" title="Visit tracker">
        <img src="https://mapmyvisitors.com/map.png?cl={{ site.mapmyvisitors.land_color | default: '000000' | escape }}&amp;w=a&amp;t={{ site.mapmyvisitors.counter | default: 'tt' | escape }}&amp;d={{ site.mapmyvisitors.widget_id | uri_escape | escape }}&amp;co={{ site.mapmyvisitors.ocean_color | default: 'ffffff' | escape }}&amp;ct={{ site.mapmyvisitors.text_color | default: '475569' | escape }}" alt="Visitor world map and total pageviews across all time" loading="lazy" width="300" height="190">
      </a>
    </div>
  </section>
  {% endif %}
{% endif %}
